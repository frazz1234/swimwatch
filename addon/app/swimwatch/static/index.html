<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>SwimWatch</title>
<style>
  :root { --bg:#f2f2f7; --card:#fff; --line:rgba(60,60,67,.16); --txt:#000; --dim:rgba(60,60,67,.6); --blue:#007aff; --red:#ff3b30;
          --ok:#34c759; --warn:#ff9500; --fill:rgba(118,118,128,.12); --shadow:0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06); color-scheme:light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --line:rgba(84,84,88,.55); --txt:#fff; --dim:rgba(235,235,245,.6); --blue:#0a84ff; --red:#ff453a;
            --ok:#30d158; --warn:#ff9f0a; --fill:rgba(118,118,128,.24); --shadow:none; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,sans-serif; -webkit-font-smoothing:antialiased;
         background:var(--bg); color:var(--txt); }
  header { position:sticky; top:0; z-index:5; padding:12px 16px 10px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center;
           background:color-mix(in srgb, var(--bg) 75%, transparent); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
           border-bottom:.5px solid var(--line); }
  h1 { font-size:24px; font-weight:700; letter-spacing:-.4px; margin:0; }
  h2 { font-size:20px; font-weight:700; letter-spacing:-.3px; margin:22px 4px 10px; }
  nav { display:flex; background:var(--fill); padding:2px; border-radius:10px; gap:2px; overflow-x:auto; max-width:100%; }
  nav button { background:none; border:0; color:var(--txt); font:600 13px/1 inherit; padding:8px 14px; border-radius:8px; cursor:pointer; white-space:nowrap; }
  nav button.on { background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04); }
  .btn { background:var(--fill); color:var(--blue); border:0; border-radius:12px; padding:10px 16px; font:600 15px/1.2 inherit; cursor:pointer; transition:opacity .15s, transform .1s; }
  .btn:active { transform:scale(.97); opacity:.8; }
  .btn.primary { background:var(--blue); color:#fff; }
  .btn:disabled { opacity:.4; cursor:default; }
  .stats { color:var(--dim); font-size:13px; margin-left:auto; }
  main { padding:8px 16px 40px; max-width:1300px; margin:auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:16px; }
  .card { background:var(--card); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); }
  .card.focus { outline:3px solid var(--blue); outline-offset:2px; }
  .card img.main { width:100%; display:block; aspect-ratio:16/9; object-fit:cover; background:#000; cursor:zoom-in; }
  .meta { padding:10px 14px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:14px; }
  .chip { background:var(--fill); border-radius:20px; padding:3px 10px; font-size:13px; font-weight:500; }
  .chip.swim { background:var(--red); color:#fff; font-weight:600; }
  .chip.unc { background:color-mix(in srgb, var(--warn) 18%, transparent); color:var(--warn); }
  .labels { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:2px 12px 12px; }
  .labels button { padding:10px 2px; font:600 13px/1.2 inherit; border-radius:10px; border:0; background:var(--fill); color:var(--txt); cursor:pointer; }
  .labels button.sel { background:var(--ok); color:#fff; }
  .frames { display:flex; gap:6px; padding:0 14px 10px; overflow-x:auto; }
  .frames img { width:76px; aspect-ratio:16/9; object-fit:cover; border-radius:8px; cursor:zoom-in; }
  .empty { color:var(--dim); padding:60px 20px; text-align:center; font-size:17px; }
  .hint { color:var(--dim); font-size:13px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; align-items:center; }
  .more { margin:20px auto; display:block; }
  #zoom { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; align-items:center; justify-content:center; z-index:10; backdrop-filter:blur(8px); }
  #zoom img { max-width:96vw; max-height:94vh; border-radius:12px; }
  .zonebox { position:relative; max-width:1000px; border-radius:16px; overflow:hidden; box-shadow:var(--shadow); }
  .zonebox img, .zonebox canvas { width:100%; display:block; }
  .zonebox canvas { position:absolute; inset:0; cursor:crosshair; touch-action:none; }
  .steps { display:flex; background:var(--fill); padding:2px; border-radius:10px; gap:2px; margin:12px 0 16px; width:fit-content; max-width:100%; overflow-x:auto; }
  .steps span { padding:7px 12px; border-radius:8px; color:var(--dim); font:600 13px/1 inherit; white-space:nowrap; }
  .steps span.on { background:var(--card); color:var(--txt); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .pick { cursor:pointer; transition:transform .12s; }
  .pick:active { transform:scale(.98); }
  .pick.sel { outline:3px solid var(--blue); outline-offset:2px; }
  .pick .meta { justify-content:space-between; }
  .list { max-height:380px; overflow:auto; background:var(--card); border-radius:14px; box-shadow:var(--shadow); }
  .list label { display:flex; gap:12px; align-items:center; padding:12px 14px; border-bottom:.5px solid var(--line); cursor:pointer; }
  .list label:last-child { border-bottom:0; }
  input[type=text], input[type=password], input[type=number], input[type=time], select, textarea {
    background:var(--fill) !important; color:var(--txt) !important; border:0 !important; border-radius:10px; padding:10px 12px; font:16px inherit; outline:none; }
  input:focus, select:focus, textarea:focus { box-shadow:0 0 0 3px color-mix(in srgb, var(--blue) 35%, transparent); }
  textarea { font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace !important; }
  input[type=checkbox] { appearance:none; -webkit-appearance:none; width:22px; height:22px; border-radius:50%; border:2px solid var(--line);
    margin:0; flex:none; cursor:pointer; transition:all .15s; vertical-align:middle; }
  input[type=checkbox]:checked { background:var(--blue); border-color:var(--blue); box-shadow:inset 0 0 0 3px var(--card); }
  .switch { display:inline-flex; gap:12px; align-items:center; cursor:pointer; }
  .switch input[type=checkbox] { width:51px; height:31px; border-radius:31px; border:0; background:var(--fill); position:relative; box-shadow:none; }
  .switch input[type=checkbox]::before { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff;
    box-shadow:0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition:transform .22s cubic-bezier(.3,.7,.4,1); }
  .switch input[type=checkbox]:checked { background:var(--ok); box-shadow:none; }
  .switch input[type=checkbox]:checked::before { transform:translateX(20px); }
  .box { background:var(--card); border-radius:18px; padding:16px; margin-bottom:16px; box-shadow:var(--shadow); }
  .err { color:var(--red); }
  #pausebar { margin:10px 16px 0; padding:12px 16px; border-radius:16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
              background:var(--card); box-shadow:var(--shadow); }
  #pausebar.on { background:color-mix(in srgb, var(--warn) 16%, var(--card)); }
  table.ph { border-collapse:collapse; width:100%; max-width:640px; background:var(--card); border-radius:14px; overflow:hidden; }
  table.ph td, table.ph th { padding:12px 14px; border-bottom:.5px solid var(--line); text-align:left; }
  table.ph th { font-size:13px; color:var(--dim); font-weight:600; }
  table.ph tr:last-child td { border-bottom:0; }
  ol { padding-left:20px; } a { color:var(--blue); }
</style>
</head>
<body>
<header>
  <h1>🏊 SwimWatch</h1>
  <nav id="nav"></nav>
  <span class="stats" id="stats"></span>
</header>
<div id="pausebar"></div>
<main id="main"></main>
<div id="zoom" onclick="this.style.display='none'"><img alt=""></div>
<script>
// ------------------------------------------------------------------ texts
const UI = {
  en: { todo:'To label', all:'All', swim:'Swimming', labeled:'Labeled', setup:'Setup',
    events:'events', tolabel:'to label', correct:'right answers', loading:'loading the models (first start: a few minutes)…', disconnected:'Home Assistant not connected',
    help:'Click the right answer. Keyboard: 1 to 4 labels the framed picture, ← → to move. "Person nearby" = someone near the pool but not in the water.',
    nothing:'Nothing here yet.', more:'More', swimming:'Swimming', noswim:'No swimming', unsure:'not sure', inwater:'in the water', near:'nearby', animal:'animal', live:'live', stale:'old picture?',
    prior:'before learning', learned:'learned', trust:'trust',
    yourcams:'Your pool cameras', add:'Add a camera', edit:'Edit', del:'Remove', test:'Test now', testnotify:'Test + notification', delask:'Remove this camera?',
    s1:'1. Camera', s2:'2. When to look', s3:'3. Water zone', s4:'4. Phones',
    s1h:'Pick the camera that sees the pool.', name:'Name', next:'Next', back:'Back', save:'Save',

    s3h:'The blue zone is the WATER (inside of the pool): someone whose box is in it counts as "in the water". Drag a point to move it, click near an edge to add a point, double-click a point to remove it. With no zone, click around the water point by point.',
    detect:'🪄 Find the pool', detecting:'Looking for the pool… (first time: about a minute)', found:'Pool found. Adjust the points if needed.', notfound:'No pool found: click around the water point by point.',

    s4h:'Which phones get a question with the picture when SwimWatch is not sure? (Home Assistant app)',
    nophones:'No phone with the Home Assistant app found.',
    ask:'Ask', ask_uncertain:'when not sure (recommended)', ask_always:'every time something is seen', ask_never:'never',
    lang:'Language', saved:'Saved. SwimWatch is watching.', zoneneed:'Draw at least 3 points.', camneed:'Pick a camera.',
    pause_out:'⏸ We\'re going swimming', pause_manual:'⏸ Pause until I turn it back on', paused_since:'Paused since', until_out:'until you get out (back on by itself after {m} min with no movement)', until_manual:'until you turn it back on', resume:'▶ Turn back on', watching:'Watching the pool.',
    alerts:'Swim alerts', alerts_h:'Which phones get an alert when someone is swimming, and which get the questions when SwimWatch is not sure?', col_alert:'Alert', col_ask:'Questions',
    critical:'Critical alerts', critical_h:'Rings even on silent and Do Not Disturb, day and night. Leave it off while testing.', reminder:'Remind me when paused for', never:'never', quiet:'Back on by itself after', quiet2:'min with no movement (mode "until you get out")',
    save_alerts:'Save', test_alert:'Send a test alert', test_sent:'Test alert sent.', helpers:'In Home Assistant', minutes_short:'min',
    season_closed:'Pool closed for the season: SwimWatch does not look.', open_season:'▶ Open the pool season', season:'Pool season (open)', season_h:'Off in winter: no analysis, no questions, no live video (saves the camera battery).',
    when:'Critical', when_always:'always', when_night:'at night', when_away:'when nobody is home', when_night_or_away:'at night or when nobody is home',
    night:'Night from', to:'to', night_people:'At night, also alert when someone is at the pool (not swimming)',
    card:'Dashboard card', card_h:'In Home Assistant: dashboard → ✏️ Edit → Add card → Manual, then paste.', copy:'Copy', copied:'Copied.',
    mqtt_on:'Real entities through MQTT', mqtt_off:'No MQTT broker: install the Mosquitto add-on to get a SwimWatch device with an image entity.',
    entities:'In Home Assistant', analyzing:'Analyzing…' },
  fr: { todo:'À classer', all:'Tout', swim:'Baignades', labeled:'Classés', setup:'Réglages',
    events:'événements', tolabel:'à classer', correct:'bonnes réponses', loading:'chargement des modèles (premier démarrage : quelques minutes)…', disconnected:'Home Assistant non connecté',
    help:'Clique sur la bonne réponse. Au clavier : 1 à 4 classe l\'image encadrée, ← → pour bouger. « Personne à côté » = quelqu\'un près de la piscine mais pas dans l\'eau.',
    nothing:'Rien ici pour l\'instant.', more:'Plus', swimming:'Baignade', noswim:'Pas de baignade', unsure:'pas sûr', inwater:'dans l\'eau', near:'à côté', animal:'animal', live:'direct', stale:'image ancienne ?',
    prior:'avant apprentissage', learned:'appris', trust:'confiance',
    yourcams:'Tes caméras de piscine', add:'Ajouter une caméra', edit:'Modifier', del:'Retirer', test:'Tester maintenant', testnotify:'Tester + notification', delask:'Retirer cette caméra ?',
    s1:'1. Caméra', s2:'2. Quand regarder', s3:'3. Zone d\'eau', s4:'4. Téléphones',
    s1h:'Choisis la caméra qui voit la piscine.', name:'Nom', next:'Suivant', back:'Retour', save:'Enregistrer',
    s2h:'SwimWatch regarde la piscine chaque fois qu\'un de ces capteurs s\'allume. Ceux de la même caméra sont déjà cochés.',
    s2none:'Aucun capteur de mouvement trouvé pour cette caméra : SwimWatch regardera aux quelques minutes.', search:'Chercher…',
    ondemand:'Cette caméra ne filme que sur demande (caméra à batterie). Ouvrir son direct quelques secondes quand ceux-ci voient une personne (plus d\'images, utilise la batterie) :',
    every:'Regarder aussi aux', minutes:'minutes (0 = non)',
    s3h:'La zone bleue = L\'EAU (l\'intérieur de la piscine) : une personne dont la boîte est dedans compte comme « dans l\'eau ». Glisse un point pour le déplacer, clique près d\'un bord pour ajouter un point, double-clique un point pour l\'enlever. Sans zone, clique autour de l\'eau point par point.',
    detect:'🪄 Trouver la piscine', detecting:'Recherche de la piscine… (la première fois : environ 1 minute)', found:'Piscine trouvée. Ajuste les points au besoin.', notfound:'Piscine non trouvée : clique autour de l\'eau point par point.',
    undo:'Annuler le dernier point', clear:'Tout effacer', newpic:'Nouvelle image',
    s4h:'Quels téléphones reçoivent une question avec l\'image quand SwimWatch n\'est pas sûr ? (app Home Assistant)',
    nophones:'Aucun téléphone avec l\'app Home Assistant trouvé.',
    ask:'Demander', ask_uncertain:'quand pas sûr (recommandé)', ask_always:'chaque fois que quelque chose est vu', ask_never:'jamais',
    lang:'Langue', saved:'Enregistré. SwimWatch surveille.', zoneneed:'Trace au moins 3 points.', camneed:'Choisis une caméra.',
    pause_out:'⏸ On va se baigner', pause_manual:'⏸ Pause jusqu\'à ce que je réactive', paused_since:'En pause depuis', until_out:'jusqu\'à ce que vous sortiez (réactivé tout seul après {m} min sans mouvement)', until_manual:'jusqu\'à ce que tu réactives', resume:'▶ Réactiver', watching:'Surveillance de la piscine active.',
    alerts:'Alertes de baignade', alerts_h:'Quels téléphones reçoivent une alerte quand quelqu\'un se baigne, et lesquels reçoivent les questions quand SwimWatch n\'est pas sûr ?', col_alert:'Alerte', col_ask:'Questions',
    critical:'Alertes critiques', critical_h:'Sonne même en mode silencieux et Ne pas déranger, jour et nuit. Laisse-le éteint pendant les tests.', reminder:'Me le rappeler quand c\'est en pause depuis', never:'jamais', quiet:'Réactivé tout seul après', quiet2:'min sans mouvement (mode « jusqu\'à ce qu\'on sorte »)',
    save_alerts:'Enregistrer', test_alert:'Envoyer une alerte test', test_sent:'Alerte test envoyée.', helpers:'Dans Home Assistant', minutes_short:'min',
    season_closed:'Piscine fermée pour la saison : SwimWatch ne regarde pas.', open_season:'▶ Ouvrir la saison', season:'Saison de piscine (ouverte)', season_h:'Éteins-la l\'hiver : aucune analyse, aucune question, aucun direct (ménage la batterie de la caméra).',
    when:'Critique', when_always:'toujours', when_night:'la nuit', when_away:'quand personne n\'est à la maison', when_night_or_away:'la nuit ou quand personne n\'est à la maison',
    night:'Nuit de', to:'à', night_people:'La nuit, alerter aussi quand quelqu\'un est à la piscine (sans se baigner)',
    card:'Carte pour le tableau de bord', card_h:'Dans Home Assistant : tableau de bord → ✏️ Modifier → Ajouter une carte → Manuel, puis colle.', copy:'Copier', copied:'Copié.',
    mqtt_on:'Vraies entités par MQTT', mqtt_off:'Pas de serveur MQTT : installe l\'add-on Mosquitto pour avoir un appareil SwimWatch avec une entité image.',
    entities:'Dans Home Assistant', analyzing:'Analyse…' },
};
let INFO = null, L = UI.en, LBL = {}, TAB = 'todo', EVENTS = [], FOCUS = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = ts => { const d = new Date(ts*1000), z = n => String(n).padStart(2,'0');
  return d.toLocaleDateString(INFO.lang === 'fr' ? 'fr-CA' : 'en-CA', {weekday:'short', day:'numeric', month:'short'}) + ' ' + `${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; };
const pct = v => v == null ? '–' : Math.round(v*100) + ' %';
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = await r.text(); try { m = JSON.parse(m).detail || m; } catch (e) {} throw new Error(m); }
  return r.json();
}
const post = (path, body, method='POST') => api(path, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});

async function loadInfo() {
  INFO = await api('api/info');
  // The page follows the browser's language when the setting is "auto" (notifications follow Home Assistant).
  if (INFO.language === 'auto') INFO.lang = (navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en';
  L = UI[INFO.lang] || UI.en; LBL = (INFO.texts[INFO.lang] || INFO.texts.en).labels;
  document.documentElement.lang = INFO.lang;
  const s = INFO.stats, B = s.labels || {};
  const acc = s.checked ? ` · ${L.correct} ${Math.round(100*s.correct/s.checked)} % (${s.checked})` : '';
  $('#stats').innerHTML = `${s.events} ${L.events} · ${s.todo} ${L.tolabel} · ` + INFO.label_keys.map(k => `${LBL[k]} ${B[k]||0}`).join(', ') + acc +
    (INFO.load_error ? ` · <span class="err">${esc(INFO.load_error)}</span>` : INFO.ready ? '' : ` · ${L.loading}`) + (INFO.connected ? '' : ` · <span class="err">${L.disconnected}</span>`);
}
function hm(ts) { const d = new Date(ts*1000), z = n => String(n).padStart(2,'0'); return `${z(d.getHours())}:${z(d.getMinutes())}`; }
function drawPause() {
  const c = INFO.control, b = $('#pausebar');
  if (!INFO.cameras.length) { b.style.display = 'none'; return; }
  b.style.display = ''; b.classList.toggle('on', c.paused);
  b.classList.toggle('on', c.paused || !c.season);
  if (!c.season) { b.innerHTML = `<b>${L.season_closed}</b><button class="btn primary" onclick="control('season',{open:true})">${L.open_season}</button>`; return; }
  b.innerHTML = c.paused
    ? `<b>${L.paused_since} ${hm(c.paused_since)}</b><span>${c.mode === 'out' ? L.until_out.replace('{m}', INFO.alerts.resume_quiet_minutes) : L.until_manual}</span>
       <button class="btn primary" onclick="control('resume')">${L.resume}</button>`
    : `<span class="hint">${L.watching}</span><button class="btn" onclick="control('pause',{mode:'out'})">${L.pause_out}</button>
       <button class="btn" onclick="control('pause',{mode:'manual'})">${L.pause_manual}</button>`;
}
async function control(what, body={}) { await post(`api/control/${what}`, body); await loadInfo(); drawPause(); }
function drawNav() {
  $('#nav').innerHTML = ['todo','all','swim','labeled','setup'].map(k => `<button data-tab="${k}" class="${k===TAB?'on':''}">${L[k]}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { TAB = b.dataset.tab; history.replaceState(null,'',location.pathname); drawNav(); show(); });
}
function show() { TAB === 'setup' ? showSetup() : showList(); }

// ------------------------------------------------------------------ connection (first start outside the add-on)
const CX = {
  en: { title:'Connect to Home Assistant', intro:'SwimWatch needs the address of your Home Assistant and a token to see your cameras.',
    url:'Home Assistant address', s1:'In Home Assistant, open your profile, Security tab:', s2:'At the bottom, under <b>Long-lived access tokens</b>, click <b>Create token</b>, name it <b>SwimWatch</b>, and copy it (it is shown only once).',
    s3:'Paste it here:', token:'Token', go:'Test and save', testing:'Testing…', unreachable:'Home Assistant does not answer at this address.', refused:'Home Assistant refused this token.', ok:'Connected!' },
  fr: { title:'Connexion à Home Assistant', intro:'SwimWatch a besoin de l\'adresse de ton Home Assistant et d\'un jeton pour voir tes caméras.',
    url:'Adresse de Home Assistant', s1:'Dans Home Assistant, ouvre ton profil, onglet Sécurité :', s2:'En bas, sous <b>Jetons d\'accès longue durée</b>, clique <b>Créer un jeton</b>, nomme-le <b>SwimWatch</b> et copie-le (il ne s\'affiche qu\'une fois).',
    s3:'Colle-le ici :', token:'Jeton', go:'Tester et enregistrer', testing:'Test…', unreachable:'Home Assistant ne répond pas à cette adresse.', refused:'Home Assistant a refusé ce jeton.', ok:'Connecté !' },
};
function showConnect() {
  const C = CX[(navigator.language || 'en').startsWith('fr') ? 'fr' : 'en'];
  $('#nav').innerHTML = ''; $('#pausebar').style.display = 'none';
  const link = () => `${$('#haurl').value.replace(/\/+$/,'')}/profile/security`;
  $('#main').innerHTML = `<div class="box" style="max-width:640px">
    <h2>${C.title}</h2><p class="hint">${C.intro}</p>
    <div class="row"><label style="width:100%">${C.url}<br><input type="text" id="haurl" value="${esc(INFO.ha_url)}" style="width:100%"></label></div>
    <ol><li>${C.s1} <a id="halink" target="_blank" rel="noopener" style="color:var(--blue)"></a></li><li>${C.s2}</li><li>${C.s3}</li></ol>
    <input type="password" id="hatoken" placeholder="${C.token}" style="width:100%" autocomplete="off">
    <div class="row"><button class="btn primary" id="cgo">${C.go}</button><span id="cmsg" class="hint"></span></div></div>`;
  const upd = () => { $('#halink').href = link(); $('#halink').textContent = link(); };
  $('#haurl').oninput = upd; upd();
  $('#cgo').onclick = async () => {
    $('#cmsg').textContent = C.testing;
    try { await post('api/setup/connection', {url: $('#haurl').value, token: $('#hatoken').value});
          $('#cmsg').textContent = C.ok; await loadInfo(); if (!INFO.cameras.length) TAB = 'setup'; drawNav(); drawPause(); show(); }
    catch (e) { $('#cmsg').innerHTML = `<span class="err">${e.message === 'refused' ? C.refused : e.message === 'unreachable' ? C.unreachable : esc(e.message)}</span>`; }
  };
}

// ------------------------------------------------------------------ events
function card(ev, i) {
  const info = (ev.details || {}).info || {};
  const c = [`<span class="chip ${ev.swimming ? 'swim' : ''}">${ev.swimming ? L.swimming : L.noswim} ${pct(ev.p)}</span>`];
  if (ev.uncertain) c.push(`<span class="chip unc">${L.unsure}</span>`);
  if (ev.in_water) c.push(`<span class="chip">${ev.in_water} ${L.inwater}</span>`);
  if (ev.persons_near) c.push(`<span class="chip">${ev.persons_near} ${L.near}</span>`);
  if (ev.animals) c.push(`<span class="chip">${L.animal}</span>`);
  if (info.live > 0) c.push(`<span class="chip">${L.live}</span>`);
  if (info.stale) c.push(`<span class="chip">${L.stale}</span>`);
  const frames = ev.n_frames > 1 ? `<div class="frames">${Array.from({length:ev.n_frames},(_,n)=>`<img loading="lazy" src="api/events/${ev.id}/frame/${n}.jpg" onclick="zoom(this.src)">`).join('')}</div>` : '';
  return `<div class="card ${i===FOCUS?'focus':''}" id="c-${ev.id}">
    <img class="main" loading="lazy" src="api/events/${ev.id}/annotated.jpg" onclick="zoom(this.src)">
    <div class="meta"><b>${when(ev.ts)}</b>${c.join('')}
      <span class="hint">${L.prior} ${pct(ev.prior)} · ${L.learned} ${pct(ev.p_model)} · ${L.trust} ${pct(ev.trust)}</span></div>
    ${frames}
    <div class="labels">${INFO.label_keys.map((k,n)=>`<button class="${ev.label===k?'sel':''}" onclick="setLabel('${ev.id}','${k}')" title="${n+1}">${LBL[k]}</button>`).join('')}</div>
  </div>`;
}
async function showList(more) {
  const before = more && EVENTS.length ? EVENTS[EVENTS.length-1].ts : '';
  const list = await api(`api/events?which=${TAB}&limit=60${before?`&before=${before}`:''}`);
  EVENTS = more ? EVENTS.concat(list) : list;
  if (!more) FOCUS = 0;
  $('#main').innerHTML = EVENTS.length
    ? `<p class="hint">${L.help}</p><div class="grid">${EVENTS.map(card).join('')}</div>${list.length===60?`<button class="btn more" onclick="showList(true)">${L.more}</button>`:''}`
    : `<div class="empty">${L.nothing}</div>`;
  const h = location.hash.slice(1);
  if (h) { const el = document.getElementById('c-'+h); if (el) { el.scrollIntoView({block:'center'}); el.classList.add('focus'); } }
}
async function setLabel(id, label) {
  const ev = EVENTS.find(e => e.id === id);
  const nl = ev && ev.label === label ? null : label;   // click again = remove
  await post(`api/events/${id}/label`, {label:nl});
  if (ev) ev.label = nl;
  const i = EVENTS.indexOf(ev), el = document.getElementById('c-'+id);
  if (TAB === 'todo' && nl) { EVENTS.splice(i,1); el.remove(); FOCUS = Math.min(FOCUS, EVENTS.length-1); refocus(); }
  else if (el) el.outerHTML = card(ev, i);
  loadInfo();
}
function refocus() {
  document.querySelectorAll('.card').forEach((c,i) => c.classList.toggle('focus', i===FOCUS));
  const c = document.querySelectorAll('.card')[FOCUS]; if (c) c.scrollIntoView({block:'nearest'});
}
document.addEventListener('keydown', e => {
  if (TAB === 'setup' || !EVENTS.length || e.target.tagName === 'INPUT') return;
  const keys = INFO.label_keys;
  if (e.key >= '1' && e.key <= String(keys.length)) setLabel(EVENTS[FOCUS].id, keys[+e.key-1]);
  if (e.key === 'ArrowRight') { FOCUS = Math.min(EVENTS.length-1, FOCUS+1); refocus(); }
  if (e.key === 'ArrowLeft') { FOCUS = Math.max(0, FOCUS-1); refocus(); }
});
function zoom(src) { $('#zoom img').src = src; $('#zoom').style.display = 'flex'; }

// ------------------------------------------------------------------ setup
let W = null;   // wizard state
function showSetup() {
  W = null;
  const cams = INFO.cameras;
  $('#main').innerHTML = `<h2>${L.yourcams}</h2>
    <div class="grid">${cams.map(c => `<div class="card">
      <img class="main" src="api/ha/snapshot.jpg?entity=${encodeURIComponent(c.camera)}&t=${Date.now()}" onerror="this.style.visibility='hidden'">
      <div class="meta"><b>${esc(c.name)}</b><span class="hint">${esc(c.camera)}</span></div>
      <div class="meta hint">${L.entities}: binary_sensor.${c.id}_swimming, sensor.${c.id}_people_in_water, sensor.${c.id}_last_analysis</div>
      <div class="row" style="padding:0 10px 10px">
        <button class="btn" onclick="startWizard('${c.id}')">${L.edit}</button>
        <button class="btn" onclick="testNow('${c.id}',false,this)">${L.test}</button>

function phoneTable(phones, alertSel, askSel) {
  return phones.length ? `<table class="ph"><tr><th></th><th>${L.col_alert}</th><th>${L.col_ask}</th></tr>${phones.map(p => `<tr><td>${esc(p.replace('notify.mobile_app_',''))}</td>

const picked = attr => [...document.querySelectorAll(`input[data-${attr}]:checked`)].map(i => i.getAttribute(`data-${attr}`));
async function drawAlerts() {
  const phones = await api('api/ha/notify'), a = INFO.alerts, c = INFO.control;
  $('#alertbox').innerHTML = `<p class="hint">${L.alerts_h}</p>${phoneTable(phones, a.services || [], INFO.notify.services || [])}
    <div class="row" style="margin-top:14px"><label class="switch"><input type="checkbox" id="crit" ${c.critical?'checked':''}> <b>${L.critical}</b></label></div>
    <p class="hint" style="margin-top:0">${L.critical_h}</p>
    <div class="row">${L.when} <select id="when">${['always','night','away','night_or_away'].map(w => `<option value="${w}" ${c.when===w?'selected':''}>${L['when_'+w]}</option>`).join('')}</select></div>
    <div class="row">${L.night} <input type="text" id="nstart" value="${a.night_start||'22:00'}" placeholder="22:00" pattern="[0-2]?[0-9]:[0-5][0-9]" maxlength="5" style="width:80px"> ${L.to} <input type="text" id="nend" value="${a.night_end||'07:00'}" placeholder="07:00" pattern="[0-2]?[0-9]:[0-5][0-9]" maxlength="5" style="width:80px"> <span class="hint">(24 h)</span></div>

    <div class="row">${L.reminder} <select id="remind">${[[30,'30 min'],[60,'1 h'],[120,'2 h'],[180,'3 h'],[0,L.never]].concat([30,60,120,180,0].includes(+a.reminder_minutes) ? [] : [[+a.reminder_minutes, a.reminder_minutes + ' min']]).map(([v,t]) => `<option value="${v}" ${+a.reminder_minutes===v?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="row">${L.quiet} <input type="number" id="quiet" min="5" max="240" value="${a.resume_quiet_minutes}" style="width:80px"> ${L.quiet2}</div>
    <div class="row"><button class="btn primary" onclick="saveAlerts(this)">${L.save_alerts}</button><button class="btn" onclick="testAlert(this)">${L.test_alert}</button><span id="amsg" class="hint"></span></div>
    <p class="hint">${L.helpers}: ${c.helpers_ok ? Object.values(c.entities).join(', ') : '—'}</p>
    <p class="hint">${INFO.mqtt ? `✅ ${L.mqtt_on} (${esc(INFO.mqtt)})` : L.mqtt_off}</p>
    <h2 style="margin-top:20px">${L.card}</h2><p class="hint">${L.card_h}</p>
    <textarea id="cardyaml" readonly style="width:100%;height:220px"></textarea>
    <div class="row"><button class="btn" onclick="copyCard()">${L.copy}</button><span id="cmsg2" class="hint"></span></div>`;
  $('#crit').onchange = async e => { await post('api/control/critical', {on: e.target.checked}); await loadInfo(); };
  $('#when').onchange = async e => { await post('api/control/when', {when: e.target.value}); await loadInfo(); };
  $('#season').onchange = async e => { await post('api/control/season', {open: e.target.checked}); await loadInfo(); drawPause(); };
  $('#cardyaml').value = (await api('api/card')).yaml;
}
async function saveAlerts() {
  try {
    await post('api/setup/settings', {alerts:{services:picked('alert'), reminder_minutes:+$('#remind').value, resume_quiet_minutes:+$('#quiet').value,
                                              night_start:$('#nstart').value, night_end:$('#nend').value, night_people:$('#nightp').checked},
                                      notify:{services:picked('ask'), ask:INFO.notify.ask}});
    await loadInfo(); drawPause(); $('#amsg').textContent = L.saved;
  } catch (e) { $('#amsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
async function copyCard() {
  const t = $('#cardyaml'); t.select();
  try { await navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand('copy'); }
  $('#cmsg2').textContent = L.copied;

async function testAlert() {
  try { await saveAlerts(); await post('api/control/test-alert', {}); $('#amsg').textContent = L.test_sent; }
  catch (e) { $('#amsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
async function delCam(id) { if (!confirm(L.delask)) return; await api(`api/setup/camera/${id}`, {method:'DELETE'}); await loadInfo(); showSetup(); }
async function testNow(id, notify, btn) {
  btn.disabled = true; const old = btn.textContent; btn.textContent = L.analyzing;
  try { const ev = await post(`api/cameras/${id}/analyze`, {notify}); EVENTS = [ev]; $('#testres').innerHTML = `<div class="grid" style="margin-top:14px">${card(ev,-1)}</div>`; loadInfo(); }
  catch (e) { $('#testres').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  btn.disabled = false; btn.textContent = old;
}
function startWizard(id) {
  const c = id && INFO.cameras.find(x => x.id === id);
  W = { step:1, id: c ? c.id : null, name: c ? c.name : (INFO.lang === 'fr' ? 'Piscine' : 'Pool'), camera: c ? c.camera : null,
        triggers: c ? [...c.triggers] : null, live_triggers: c ? [...c.live_triggers] : null, use_live: c ? !!c.live : true,
        interval: c ? c.interval_minutes : 0, zone: c ? c.zone.map(p=>[...p]) : [],
        services: [...(INFO.notify.services||[])], ask: INFO.notify.ask || 'uncertain', language: INFO.language || 'auto' };
  wizard();
}
function steps() { return `<div class="steps">${[1,2,3,4].map(n => `<span class="${n===W.step?'on':''}">${L['s'+n]}</span>`).join('')}</div>`; }
function nav(nextOk=true, last=false) {
  return `<div class="row">${W.step>1?`<button class="btn" onclick="W.step--;wizard()">${L.back}</button>`:`<button class="btn" onclick="showSetup()">✕</button>`}
    <button class="btn primary" ${nextOk?'':'disabled'} onclick="${last?'saveWizard()':'nextStep()'}">${last?L.save:L.next}</button><span id="wmsg" class="hint"></span></div>`;
}
async function nextStep() {
  if (W.step === 1 && !W.camera) { $('#wmsg').textContent = L.camneed; return; }
  if (W.step === 3 && W.zone.length < 3) { $('#wmsg').textContent = L.zoneneed; return; }
  W.step++; wizard();
}
async function wizard() {
  const m = $('#main');
  if (W.step === 1) {
    m.innerHTML = steps() + `<p class="hint">${L.s1h}</p><div class="grid" id="camgrid"><div class="hint">…</div></div>
      <div class="row"><label>${L.name} <input type="text" id="wname" value="${esc(W.name)}" maxlength="40"></label></div>` + nav(true);
    $('#wname').oninput = e => W.name = e.target.value;
    const cams = await api('api/ha/cameras');
    $('#camgrid').innerHTML = cams.map(c => `<div class="card pick ${c.entity===W.camera?'sel':''}" data-e="${c.entity}">
        <img class="main" loading="lazy" src="api/ha/snapshot.jpg?entity=${encodeURIComponent(c.entity)}" onerror="this.style.visibility='hidden'" style="cursor:pointer">
        <div class="meta"><b>${esc(c.name)}</b><span class="hint">${esc(c.entity)}</span></div></div>`).join('');
    document.querySelectorAll('.pick').forEach(p => p.onclick = () => {
      if (W.camera !== p.dataset.e) { W.triggers = null; W.live_triggers = null; W.zone = W.camera ? [] : W.zone; }
      W.camera = p.dataset.e; document.querySelectorAll('.pick').forEach(x => x.classList.toggle('sel', x===p));
    });
  }
  if (W.step === 2) {
    m.innerHTML = steps() + `<div class="hint">…</div>`;
    const s = await api(`api/ha/suggest?entity=${encodeURIComponent(W.camera)}`);
    if (W.triggers === null) W.triggers = s.triggers;
    if (W.live_triggers === null) W.live_triggers = s.live_triggers;
    if (!s.triggers.length && !W.triggers.length && !W.interval) W.interval = 5;
    const row = (b, arr) => `<label><input type="checkbox" data-e="${b.entity}" data-arr="${arr}" ${W[arr].includes(b.entity)?'checked':''}> ${esc(b.name)} <span class="hint">${b.entity}${b.same_device?' ★':''}</span></label>`;
    const persons = s.binary_sensors.filter(b => W.triggers.includes(b.entity) || (b.same_device && b.motion));
    m.innerHTML = steps() + `<p class="hint">${s.triggers.length ? L.s2h : L.s2none}</p>
      <input type="text" id="flt" placeholder="${L.search}" style="width:100%;margin-bottom:6px">
      <div class="list" id="blist">${s.binary_sensors.map(b => row(b,'triggers')).join('')}</div>
      ${s.on_demand ? `<div class="box" style="margin-top:12px"><label><input type="checkbox" id="uselive" ${W.use_live?'checked':''}> ${L.ondemand}</label>
        <div class="list" style="margin-top:8px">${persons.map(b => row(b,'live_triggers')).join('')}</div></div>` : ''}
      <div class="row">${L.every} <input type="number" id="every" min="0" max="120" step="1" value="${W.interval}" style="width:80px"> ${L.minutes}</div>` + nav(true);
    document.querySelectorAll('input[data-arr]').forEach(i => i.onchange = () => {
      const a = W[i.dataset.arr], e = i.dataset.e;
      if (i.checked && !a.includes(e)) a.push(e); if (!i.checked) a.splice(a.indexOf(e), 1);
    });
    $('#flt').oninput = e => { const q = e.target.value.toLowerCase(); document.querySelectorAll('#blist label').forEach(l => l.style.display = l.textContent.toLowerCase().includes(q) ? '' : 'none'); };
    if ($('#uselive')) $('#uselive').onchange = e => W.use_live = e.target.checked;
    $('#every').oninput = e => W.interval = +e.target.value || 0;
  }
  if (W.step === 3) {
    m.innerHTML = steps() + `<p class="hint">${L.s3h}</p>
      <div class="row"><button class="btn primary" id="autobtn" onclick="autoZone()">${L.detect}</button><span id="zmsg" class="hint"></span></div>
      <div class="zonebox"><img id="snap"><canvas id="cv"></canvas></div>
      <div class="row"><button class="btn" onclick="undoZone()">${L.undo}</button>
      <button class="btn" onclick="keep();W.zone=[];draw()">${L.clear}</button><button class="btn" onclick="loadSnap()">${L.newpic}</button></div>` + nav(true);
    W.hist = [];
    loadSnap();
    if (W.zone.length < 3) autoZone();
  }
  if (W.step === 4) {
    m.innerHTML = steps() + `<div class="hint">…</div>`;
    const phones = await api('api/ha/notify');
    if (W.alerts === undefined) W.alerts = [...(INFO.alerts.services || [])];
    m.innerHTML = steps() + `<p class="hint">${L.alerts_h}</p>${phoneTable(phones, W.alerts, W.services)}
      <p class="hint">${L.critical}: ${L.critical_h}</p>
      <div class="row">${L.ask} <select id="ask">${['uncertain','always','never'].map(a => `<option value="${a}" ${W.ask===a?'selected':''}>${L['ask_'+a]}</option>`).join('')}</select></div>
      <div class="row">${L.lang} <select id="lng">${[['auto','Auto (Home Assistant)'],['en','English'],['fr','Français']].map(([v,t]) => `<option value="${v}" ${W.language===v?'selected':''}>${t}</option>`).join('')}</select></div>` + nav(true, true);
    document.querySelectorAll('input[data-alert],input[data-ask]').forEach(i => i.onchange = () => { W.alerts = picked('alert'); W.services = picked('ask'); });
    $('#ask').onchange = e => W.ask = e.target.value; $('#lng').onchange = e => W.language = e.target.value;
  }
}
async function saveWizard() {
  try {
    await post('api/setup/camera', {id:W.id, name:W.name, camera:W.camera, triggers:W.triggers, live_triggers:W.live_triggers,
                                    use_live:W.use_live, interval_minutes:W.interval, zone:W.zone});
    await post('api/setup/settings', {notify:{services:W.services, ask:W.ask}, alerts:{services:W.alerts || INFO.alerts.services || []}, language:W.language});
    await loadInfo(); drawNav(); drawPause(); showSetup();
    $('#testres').innerHTML = `<p style="color:var(--ok)">${L.saved}</p>`;
  } catch (e) { $('#wmsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
function keep() { W.hist.push(W.zone.map(p => [...p])); if (W.hist.length > 50) W.hist.shift(); }
function undoZone() { if (W.hist.length) { W.zone = W.hist.pop(); draw(); } }
async function autoZone() {
  const b = $('#autobtn'); b.disabled = true; $('#zmsg').textContent = L.detecting;
  try { const r = await post('api/ha/autozone', {entity: W.camera}); keep(); W.zone = r.zone; draw(); $('#zmsg').textContent = L.found; }
  catch (e) { $('#zmsg').textContent = e.message === 'no pool found' ? L.notfound : e.message; }
  b.disabled = false;
}
function loadSnap() {
  const img = $('#snap'), cv = $('#cv');
  img.onload = () => { cv.width = img.naturalWidth; cv.height = img.naturalHeight; draw(); };
  img.src = `api/ha/snapshot.jpg?entity=${encodeURIComponent(W.camera)}&t=${Date.now()}`;
  // positions in screen pixels, to grab points with a finger as easily as with a mouse
  const at = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, r]; };
  const near = (x, y, r) => { let best = -1, bd = 1e9;
    W.zone.forEach(([px, py], i) => { const d = Math.hypot((px - x) * r.width, (py - y) * r.height); if (d < bd) { bd = d; best = i; } });
    return bd <= 18 ? best : -1; };
  let drag = -1;
  cv.onpointerdown = e => {
    const [x, y, r] = at(e); const i = near(x, y, r);
    keep();
    if (i >= 0) { drag = i; cv.setPointerCapture(e.pointerId); return; }
    if (W.zone.length < 3) { W.zone.push([x, y]); draw(); return; }
    // insert on the closest edge
    let bi = 0, bd = 1e9;
    W.zone.forEach((a, k) => { const b = W.zone[(k + 1) % W.zone.length];
      const ax = a[0] * r.width, ay = a[1] * r.height, bx = b[0] * r.width, by = b[1] * r.height, px = x * r.width, py = y * r.height;
      const t = Math.max(0, Math.min(1, ((px - ax) * (bx - ax) + (py - ay) * (by - ay)) / ((bx - ax) ** 2 + (by - ay) ** 2 || 1)));
      const d = Math.hypot(px - (ax + t * (bx - ax)), py - (ay + t * (by - ay))); if (d < bd) { bd = d; bi = k; } });
    W.zone.splice(bi + 1, 0, [x, y]); drag = bi + 1; cv.setPointerCapture(e.pointerId); draw();
  };
  cv.onpointermove = e => { if (drag < 0) return; const [x, y] = at(e);
    W.zone[drag] = [Math.max(0, Math.min(1, x)), Math.max(0, Math.min(1, y))]; draw(); };
  cv.onpointerup = cv.onpointercancel = () => { drag = -1; };
  cv.ondblclick = e => { const [x, y, r] = at(e); const i = near(x, y, r); if (i >= 0 && W.zone.length > 3) { keep(); W.zone.splice(i, 1); draw(); } };
}
function draw() {
  const cv = $('#cv'); if (!cv) return; const g = cv.getContext('2d'), w = cv.width, h = cv.height;
  g.clearRect(0,0,w,h); if (!W.zone.length) return;
  g.lineWidth = Math.max(2, w/320); g.strokeStyle = '#2fa8ff'; g.fillStyle = '#2fa8ff33';
  g.beginPath(); W.zone.forEach(([x,y],i) => i ? g.lineTo(x*w,y*h) : g.moveTo(x*w,y*h)); g.closePath(); g.fill(); g.stroke();
  const rad = Math.max(4, w/160); W.zone.forEach(([x,y]) => { g.beginPath(); g.arc(x*w,y*h,rad,0,7); g.fillStyle = '#fff'; g.fill(); g.lineWidth = Math.max(1, w/640); g.strokeStyle = '#2fa8ff'; g.stroke(); });
}

(async () => {
  await loadInfo();
  if (INFO.need_connection) { showConnect(); return; }
  if (!INFO.cameras.length) TAB = 'setup';
  else if (location.hash.length > 1) TAB = 'all';
  drawNav(); drawPause(); show();
  setInterval(async () => { await loadInfo(); drawPause(); }, 30000);
})();
</script>
