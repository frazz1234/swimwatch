[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swimwatch"
version = "0.3.0"
description = "Tells Home Assistant when someone is swimming in the pool, from any camera. Local AI that learns from your answers."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "torch", "torchvision", "transformers>=4.49", "open_clip_torch>=2.24", "fastapi>=0.110",
  "uvicorn[standard]>=0.29", "aiohttp>=3.9", "pyyaml>=6", "pillow>=10", "numpy>=1.26",
]

[project.scripts]
swimwatch = "swimwatch.__main__:run"

[tool.setuptools.packages.find]
include = ["swimwatch*"]

[tool.setuptools.package-data]
swimwatch = ["static/*"]
