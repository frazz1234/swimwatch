name: SwimWatch
version: "0.5.1"
slug: swimwatch
description: Tells you when someone is swimming in your pool, from any camera. Local AI that learns from your answers.
url: https://github.com/frazz1234/swimwatch
image: "ghcr.io/frazz1234/{arch}-swimwatch"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
services:
  - mqtt:want
ingress: true
ingress_port: 8765
panel_icon: mdi:pool
panel_title: SwimWatch
options:
  performance: normal
schema:
  performance: list(normal|light)
